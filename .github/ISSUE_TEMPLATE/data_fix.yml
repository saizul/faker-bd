name: Data correction or addition
description: A misspelled name, a wrong district, a missing upazila or postcode
labels: [data, good first issue]
body:
  - type: textarea
    id: data
    attributes:
      label: What should change?
      description: The current value, the correct value (English and Bangla) and where it appears.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Public source
      description: A government or other public page that confirms it.
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to open the pull request myself
